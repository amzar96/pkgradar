[project]
name = "pkgradar"
version = "0.1.0"
description = "Dependency radar for uv projects - graph, drift, conflicts, advisories"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "packaging>=24.0",
    "textual>=0.80",
]

[project.scripts]
pkgradar = "pkgradar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkgradar"]
