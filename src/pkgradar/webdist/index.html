<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#07080b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)" />
    <title>pkgradar · uv dependency intelligence</title>
    <script>
      // Set the theme before the bundle paints so there is no flash of the
      // wrong palette. Keep this in sync with web/src/lib/theme.ts.
      (function () {
        try {
          var saved = window.localStorage.getItem("pkgradar:theme");
          var dark =
            saved === "dark" ||
            (saved !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var theme = dark ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
